<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eaeef3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2d3a4d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Misty dawn palette: slate blue, fog, cream, peach */
:root{
  --bg-top:#eaeef3; --bg-bot:#f8f6f3;
  --bg:#f7f8fa; --surface:rgba(255,255,255,.55); --sunk:rgba(255,255,255,.28); --line:rgba(35,48,68,.1);
  --glass:rgba(255,255,255,.5); --glass-line:rgba(255,255,255,.85);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,.15) 55%,rgba(255,255,255,.35));
  --hi:inset 0 1px 0 rgba(255,255,255,.95);
  --orb1:rgba(150,178,214,.7); --orb2:rgba(238,196,160,.62); --orb3:rgba(186,204,228,.7);
  --ring:rgba(35,48,68,.22); --panel:rgba(248,249,251,.72); --scrim:rgba(35,48,68,.18);
  --text:#233044; --muted:#8a93a1;
  --accent:#2b3a52; --accent-soft:#e3e8ef; --on-accent:#ffffff;
  --peach:#c9a684; --peach-soft:#f1e7dc;
  --red:#b5523d; --red-soft:#f8e3dc; --amber:#b9772c; --amber-soft:#f8ebd8;
  --shadow:0 1px 2px rgba(35,48,68,.04),0 10px 30px -12px rgba(35,48,68,.14);
  --shadow-lg:0 22px 50px -20px rgba(35,48,68,.25);
  --radius:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-top:#2d3a4d; --bg-bot:#3a3d4b;
  --bg:#323d4f; --surface:rgba(255,255,255,.09); --sunk:rgba(255,255,255,.05); --line:rgba(255,255,255,.1);
  --glass:rgba(255,255,255,.08); --glass-line:rgba(255,255,255,.16);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 55%,rgba(255,255,255,.06));
  --hi:inset 0 1px 0 rgba(255,255,255,.14);
  --orb1:rgba(110,140,185,.5); --orb2:rgba(214,150,120,.32); --orb3:rgba(130,160,190,.38);
  --ring:rgba(255,255,255,.24); --panel:rgba(48,59,77,.78); --scrim:rgba(10,15,25,.3);
  --text:#f2eee8; --muted:#aeb7c3;
  --accent:#bccde0; --accent-soft:rgba(188,205,224,.16); --on-accent:#243042;
  --peach:#efbf98; --peach-soft:rgba(239,191,152,.18);
  --red:#ee9a84; --red-soft:rgba(238,154,132,.18); --amber:#efbf74; --amber-soft:rgba(239,191,116,.17);
  --shadow:0 1px 2px rgba(0,0,0,.12),0 10px 28px -12px rgba(0,0,0,.35);
  --shadow-lg:0 22px 50px -20px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-top:#2d3a4d; --bg-bot:#3a3d4b;
  --bg:#323d4f; --surface:rgba(255,255,255,.09); --sunk:rgba(255,255,255,.05); --line:rgba(255,255,255,.1);
  --glass:rgba(255,255,255,.08); --glass-line:rgba(255,255,255,.16);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 55%,rgba(255,255,255,.06));
  --hi:inset 0 1px 0 rgba(255,255,255,.14);
  --orb1:rgba(110,140,185,.5); --orb2:rgba(214,150,120,.32); --orb3:rgba(130,160,190,.38);
  --ring:rgba(255,255,255,.24); --panel:rgba(48,59,77,.78); --scrim:rgba(10,15,25,.3);
  --text:#f2eee8; --muted:#aeb7c3;
  --accent:#bccde0; --accent-soft:rgba(188,205,224,.16); --on-accent:#243042;
  --peach:#efbf98; --peach-soft:rgba(239,191,152,.18);
  --red:#ee9a84; --red-soft:rgba(238,154,132,.18); --amber:#efbf74; --amber-soft:rgba(239,191,116,.17);
  --shadow:0 1px 2px rgba(0,0,0,.12),0 10px 28px -12px rgba(0,0,0,.35);
  --shadow-lg:0 22px 50px -20px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg-top)}
html,body{height:100%;margin:0}
body{background:transparent;color:var(--text);font:400 16px/1.45 "Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 30% at 12% 18%,var(--orb1),transparent 70%),
    radial-gradient(34% 28% at 92% 42%,var(--orb2),transparent 70%),
    radial-gradient(44% 34% at 30% 88%,var(--orb3),transparent 70%),
    linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 75%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
header{display:flex;align-items:center;gap:12px;padding:16px 22px;flex-wrap:wrap}
.brand{font-weight:400;font-size:30px;letter-spacing:.01em;display:flex;align-items:baseline;gap:12px}
.brand small{font-weight:400;font-size:14px;color:var(--muted);letter-spacing:.02em}
.summary{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:500;padding:3px 11px;border-radius:99px;background:var(--glass);color:var(--muted);border:1px solid var(--glass-line)}
.pill.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.pill.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--glass-line);border-radius:99px;padding:3px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:99px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--hi),var(--shadow)}
.icon-btn{border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:99px;height:36px;min-width:36px;padding:0 12px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.icon-btn:hover{color:var(--text)}
.icon-btn[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:0 0 0 3px var(--accent-soft)}
.sync.saving i{background:var(--amber)} .sync.error i{background:var(--red)}

main{flex:1;min-height:0;overflow:auto}

/* Board */
.board{display:flex;flex-direction:column;gap:16px;max-width:860px;margin:0 auto;padding:8px 22px 24px}
.col{background:var(--sunk);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:var(--hi);border-radius:24px;padding:12px;min-height:56px;transition:background .15s}
.col.drop{background:var(--accent-soft)}
.col h2{font-size:13px;margin:4px 8px 12px;display:flex;justify-content:space-between;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.col h2 span{color:var(--muted);font-weight:400;letter-spacing:0;min-width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-line);font-size:12px}
.col[data-status="unsorted"] h2 span{background:var(--peach-soft);border-color:transparent}
.col .hint{font-size:13px;color:var(--muted);margin:0 8px 10px}
.quick{width:100%;border:1px dashed var(--line);background:var(--glass);border-radius:14px;padding:10px 13px;margin-bottom:10px}
.quick:focus{border-style:solid;border-color:var(--accent);outline:none;background:var(--surface)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--sheen),var(--surface);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--glass-line)!important;border-radius:var(--radius);box-shadow:var(--hi),var(--shadow);padding:13px 14px 13px 16px;cursor:pointer;position:relative;display:flex;gap:11px;align-items:flex-start;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.card.overdue::before{background:var(--red)} .card.today::before{background:var(--amber)} .card.event::before{background:var(--peach)}
.card.overdue.event::before{background:var(--red)} .card.today.event::before{background:var(--amber)}
.card:hover{transform:translateY(-1px);box-shadow:var(--hi),var(--shadow-lg)}
.card.dragging{opacity:.4}
.card .body{flex:1;min-width:0}
.card .t{font-size:15.5px;overflow-wrap:anywhere}
.card.is-done .t{color:var(--muted);text-decoration:line-through}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.meta .due.overdue{color:var(--red);font-weight:500} .meta .due.today{color:var(--amber);font-weight:500}
.meta .cal{color:var(--peach);filter:saturate(1.3) brightness(.85)}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ring);background:var(--glass);padding:0;margin-top:0;display:grid;place-items:center;color:transparent;font-size:12px;box-shadow:inset 0 1px 2px rgba(47,58,72,.08)}
.check:hover{border-color:var(--accent);color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:none}
.empty{font-size:14px;color:var(--muted);padding:6px}

/* List */
.list{max-width:860px;margin:0 auto;padding:8px 22px 24px}
.group{margin-bottom:24px}
.group h3{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 4px;display:flex;gap:8px;align-items:baseline}
.group h3 span{color:var(--muted);font-weight:400;font-size:13px;letter-spacing:0}
.group.overdue h3{color:var(--red)} .group.today h3{color:var(--amber)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--sheen),var(--surface);border-bottom:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-radius:var(--radius) var(--radius) 0 0}
.row:last-child{border-radius:0 0 var(--radius) var(--radius);border-bottom:0}
.row:only-of-type{border-radius:var(--radius)}
.rows{box-shadow:var(--hi),var(--shadow);border-radius:var(--radius);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.is-done .t{color:var(--muted);text-decoration:line-through}
.row .st{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.row .d{font-size:14px;color:var(--muted);white-space:nowrap;min-width:80px;text-align:right}
.row .d.overdue{color:var(--red);font-weight:500} .row .d.today{color:var(--amber);font-weight:500}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-left:1px solid var(--glass-line);z-index:11;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer.dragging{transition:none}
.drawer{touch-action:pan-y}
html.drawer-open,html.drawer-open body{overflow:hidden;overscroll-behavior:none}
html.drawer-open main{overflow:hidden!important;touch-action:none;pointer-events:none}
html.drawer-open .board{overflow:hidden!important}
.drawer-top{display:flex;align-items:center;gap:8px;padding:12px 18px}
.close-btn{width:44px;height:44px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);color:var(--text);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--hi);cursor:pointer}
.close-btn:active{transform:scale(.94)}
.drawer-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:6px 22px 40px}
.title-input{width:100%;border:0;background:none;font-size:26px;font-weight:300;line-height:1.25;resize:none;padding:4px 0 8px;overflow:hidden}
.title-input:focus{outline:none;border-bottom:1px solid var(--accent)}
.field{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.field>label{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field .seg{flex-wrap:wrap;border-radius:18px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--glass-line);background:var(--glass);border-radius:12px;padding:8px 10px;font-size:15px}
.link-btn{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 6px;text-decoration:underline}
.switch{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);border:0;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"]::after{transform:translateX(18px)}
.cal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--glass-line);background:var(--sheen),var(--surface);border-radius:99px;padding:8px 16px;font-size:14px;text-decoration:none;color:var(--text);display:inline-block;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--red);box-shadow:none}
.section{margin-top:26px}
.section h4{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.section h4 span{color:var(--muted);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none}
.sub{display:flex;align-items:center;gap:10px;padding:5px 0}
.sub input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none}
.sub .txt{flex:1;border:0;background:none;padding:4px 0;font-size:15px;border-bottom:1px solid transparent}
.sub .txt:focus{outline:none;border-bottom-color:var(--line)}
.sub.done .txt{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;opacity:.5}
.x:hover{opacity:1;color:var(--red)}
.add-line{width:100%;border:0;border-bottom:1px dashed var(--line);background:none;padding:9px 0;font-size:15px}
.add-line:focus{outline:none;border-bottom-color:var(--accent)}
.comment{padding:12px 14px;background:var(--sheen),var(--surface);border:1px solid var(--glass-line);border-radius:14px;margin-bottom:8px;box-shadow:var(--hi),var(--shadow)}
.comment .when{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.comment p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-box{width:100%;min-height:76px;border:1px solid var(--glass-line);border-radius:14px;background:var(--glass);padding:10px 12px;resize:vertical}
.foot{margin-top:30px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* Modal + toast */
dialog{border:1px solid var(--glass-line);border-radius:24px;background:var(--panel);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);color:var(--text);padding:24px;width:min(460px,92vw);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(35,48,68,.3);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 6px;font-size:24px;font-weight:300}
dialog p{color:var(--muted);font-size:14px;margin:0 0 14px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
dialog .inp{width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--accent);color:var(--on-accent);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{margin:20px;padding:14px 16px;border-radius:16px;background:var(--red-soft);color:var(--red);font-size:14px}
.welcome{max-width:520px;margin:12vh auto;padding:0 22px;text-align:left}
.welcome h1{font-size:34px;font-weight:300;margin:0 0 8px}
.welcome p{color:var(--muted)}

@media (max-width:700px){
  header{padding:10px 16px;gap:8px}
  .brand{font-size:26px}
  .brand small{display:none}
  .summary{order:10;width:100%}
  .board{padding:6px 16px 16px;gap:12px}
  .list{padding:6px 16px 16px}
  .field{grid-template-columns:90px 1fr}
  .icon-btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Ledger <small id="dateLine"></small></div>
  <div class="summary" id="summary"></div>
  <div class="spacer"></div>
  <div class="sync" id="sync"><i></i><span>Synced</span></div>
  <div class="seg" role="group" aria-label="View">
    <button id="vBoard" aria-pressed="true">Board</button>
    <button id="vList" aria-pressed="false">List</button>
  </div>
  <button class="icon-btn" id="doneBtn" aria-pressed="false" title="Show finished tasks">✓ <span class="lbl">Done</span></button>
  <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
  <button class="icon-btn" id="themeBtn" title="Switch light or dark">◐</button>
  <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
</header>
<main id="main"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-top">
    <button class="check" id="dCheck" title="Mark done">✓</button>
    <div class="spacer"></div>
    <button class="close-btn" id="dClose" aria-label="Close" title="Close">✕</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<dialog id="settings">
  <h2>Connect Ledger</h2>
  <p>Ledger reads and writes your tasks in a GitHub repo. Your token stays in this browser only.</p>
  <label for="sOwner">GitHub username</label>
  <input class="inp" id="sOwner" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="sRepo">Tasks repo</label>
  <input class="inp" id="sRepo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ledger-data">
  <label for="sBranch">Branch</label>
  <input class="inp" id="sBranch" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="main">
  <label for="sToken">Access token</label>
  <input class="inp" id="sToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
  <div class="inline" style="margin-top:18px;justify-content:flex-end">
    <button class="btn" id="sCancel">Cancel</button>
    <button class="btn primary" id="sSave">Save and connect</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
(() => {
/* ---------- storage + config ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let cfg = LS.get('ledger.cfg', { owner:'', repo:'ledger-data', branch:'main', token:'' });
const theme = LS.get('ledger.theme', null);
if (theme) document.documentElement.dataset.theme = theme;

const STATUSES = [
  ['unsorted','Unsorted','Captured and not looked at yet'],
  ['active','Active',''],
  ['waiting','Waiting','Blocked on someone else'],
  ['done','Done','']
];
const LABEL = Object.fromEntries(STATUSES.map(s => [s[0], s[1]]));

const state = {
  tasks: new Map(),
  view: LS.get('ledger.view', 'board'),
  showDone: LS.get('ledger.showDone', false),
  openId: null,
  loaded: false,
  error: ''
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
function dayDiff(s){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((parseYmd(s) - t) / 86400000); }
function dueState(t){
  if (!t.due || t.status === 'done') return '';
  const td = todayStr();
  return t.due < td ? 'overdue' : t.due === td ? 'today' : '';
}
function fmtTime(hm){
  if (!hm) return '';
  const [h, m] = hm.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${pad(m)}${h < 12 ? 'am' : 'pm'}`;
}
function fmtDue(t){
  if (!t.due) return '';
  const n = dayDiff(t.due), d = parseYmd(t.due);
  let s;
  if (n === 0) s = 'Today';
  else if (n === 1) s = 'Tomorrow';
  else if (n === -1) s = 'Yesterday';
  else if (n > 1 && n < 7) s = d.toLocaleDateString(undefined, { weekday:'long' });
  else s = d.toLocaleDateString(undefined, { month:'short', day:'numeric', ...(d.getFullYear() !== new Date().getFullYear() ? { year:'numeric' } : {}) });
  return t.time ? `${s}, ${fmtTime(t.time)}` : s;
}
const fmtStamp = iso => { try { return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); } catch { return iso; } };

function newId(){
  return todayStr() + '-' + Math.random().toString(36).slice(2, 8);
}
function sortByDue(a, b){
  if (a.due && b.due) return a.due === b.due ? (a.time || '99').localeCompare(b.time || '99') : a.due.localeCompare(b.due);
  if (a.due) return -1;
  if (b.due) return 1;
  return (b.created || '').localeCompare(a.created || '');
}

/* ---------- GitHub ---------- */
async function gh(path, opts = {}){
  const res = await fetch('https://api.github.com' + path, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + cfg.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {})
    }
  });
  if (!res.ok){
    let msg = res.status + '';
    try { msg = (await res.json()).message || msg; } catch {}
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return res.status === 204 ? null : res.json();
}
function b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const filePath = id => `/repos/${cfg.owner}/${cfg.repo}/contents/tasks/${id}.json`;

async function loadTasks(){
  const query = `query($o:String!,$r:String!,$e:String!){repository(owner:$o,name:$r){object(expression:$e){... on Tree{entries{name oid object{... on Blob{text}}}}}}}`;
  const res = await gh('/graphql', { method:'POST', body: JSON.stringify({ query, variables: { o: cfg.owner, r: cfg.repo, e: `${cfg.branch}:tasks` } }) });
  if (res.errors) throw new Error(res.errors[0].message);
  if (!res.data.repository) throw new Error(`Can't find ${cfg.owner}/${cfg.repo}. Check the name and that your token can read it.`);
  const entries = res.data.repository.object?.entries || [];
  const next = new Map();
  for (const e of entries){
    if (!e.name.endsWith('.json') || !e.object?.text) continue;
    try {
      const t = JSON.parse(e.object.text);
      t.id ||= e.name.replace(/\.json$/, '');
      t.subtasks ||= []; t.comments ||= [];
      t._sha = e.oid;
      const local = state.tasks.get(t.id);
      next.set(t.id, local && pending.has(t.id) ? local : t);
    } catch { console.warn('Skipped unreadable file', e.name); }
  }
  // keep tasks created locally that haven't reached GitHub yet
  for (const [id, t] of state.tasks) if (!next.has(id) && !t._sha && pending.has(id)) next.set(id, t);
  state.tasks = next;
}

const timers = {}, chains = {}, pending = new Set();
function queueSave(t){
  t.updated = new Date().toISOString();
  pending.add(t.id);
  setSync('saving');
  clearTimeout(timers[t.id]);
  timers[t.id] = setTimeout(() => {
    chains[t.id] = (chains[t.id] || Promise.resolve()).then(() => saveTask(t)).finally(() => {
      pending.delete(t.id);
      if (!pending.size && syncState !== 'error') setSync('saved');
    });
  }, 700);
}
async function saveTask(t, retry = true){
  if (!state.tasks.has(t.id)) return;
  const { _sha, ...data } = t;
  const body = {
    message: `${_sha ? 'Update' : 'Add'}: ${t.title}`.slice(0, 72),
    content: b64(JSON.stringify(data, null, 2) + '\n'),
    branch: cfg.branch
  };
  if (_sha) body.sha = _sha;
  try {
    const r = await gh(filePath(t.id), { method:'PUT', body: JSON.stringify(body) });
    t._sha = r.content.sha;
  } catch (e){
    if (retry && (e.status === 409 || e.status === 422)){
      try { const cur = await gh(filePath(t.id) + '?ref=' + encodeURIComponent(cfg.branch)); t._sha = cur.sha; }
      catch (e2){ if (e2.status === 404) t._sha = undefined; }
      return saveTask(t, false);
    }
    setSync('error', `Couldn't save "${t.title}": ${e.message}`);
  }
}
async function removeTask(t){
  clearTimeout(timers[t.id]);
  state.tasks.delete(t.id);
  render();
  if (!t._sha) return;
  setSync('saving');
  try {
    await gh(filePath(t.id), { method:'DELETE', body: JSON.stringify({ message: `Delete: ${t.title}`.slice(0,72), sha: t._sha, branch: cfg.branch }) });
    setSync('saved');
  } catch (e){ setSync('error', `Couldn't delete: ${e.message}`); }
}

/* ---------- sync indicator + toast ---------- */
let syncState = 'saved';
function setSync(s, msg){
  syncState = s;
  const el = $('sync');
  el.className = 'sync ' + s;
  el.querySelector('span').textContent = s === 'saving' ? 'Saving' : s === 'error' ? 'Not saved' : 'Synced';
  el.title = msg || '';
  if (msg) toast(msg);
}
let toastTimer;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- task helpers ---------- */
function createTask(title, status = 'unsorted'){
  const now = new Date().toISOString();
  const t = { id: newId(), title: title.trim(), status, due: null, time: null, calendar: false, subtasks: [], comments: [], created: now, updated: now };
  state.tasks.set(t.id, t);
  queueSave(t);
  return t;
}
// Doing real work on an unsorted task means you've triaged it.
function promote(t){
  if (t.status === 'unsorted'){ t.status = 'active'; toast('Moved to Active'); }
}
function setStatus(t, s){
  if (t.status === s) return;
  t.status = s;
  if (s === 'done') t.completed = new Date().toISOString(); else delete t.completed;
  queueSave(t);
}

/* ---------- rendering ---------- */
function visible(){ return [...state.tasks.values()].filter(t => state.showDone || t.status !== 'done'); }

function cardMeta(t){
  const bits = [];
  const ds = dueState(t);
  if (t.due) bits.push(`<span class="due num ${ds}">${esc(fmtDue(t))}</span>`);
  if (t.calendar) bits.push(`<span class="cal" title="On calendar">▣ Calendar</span>`);
  if (t.subtasks.length) bits.push(`<span class="num">☑ ${t.subtasks.filter(s => s.done).length}/${t.subtasks.length}</span>`);
  if (t.comments.length) bits.push(`<span class="num">💬 ${t.comments.length}</span>`);
  return bits.length ? `<div class="meta">${bits.join('')}</div>` : '';
}

function renderSummary(){
  const open = [...state.tasks.values()].filter(t => t.status !== 'done');
  const over = open.filter(t => dueState(t) === 'overdue').length;
  const today = open.filter(t => dueState(t) === 'today').length;
  const uns = open.filter(t => t.status === 'unsorted').length;
  const out = [];
  if (over) out.push(`<span class="pill red num">${over} overdue</span>`);
  if (today) out.push(`<span class="pill amber num">${today} due today</span>`);
  if (uns) out.push(`<span class="pill num">${uns} unsorted</span>`);
  $('summary').innerHTML = out.join('');
  $('dateLine').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}

function renderBoard(){
  const tasks = visible();
  const cols = STATUSES.filter(s => s[0] !== 'done' || state.showDone);
  return `<div class="board">${cols.map(([key, label, hint]) => {
    const list = tasks.filter(t => t.status === key).sort(key === 'done' ? (a,b) => (b.completed||'').localeCompare(a.completed||'') : sortByDue);
    return `<section class="col" data-status="${key}">
      <h2>${label} <span class="num">${list.length}</span></h2>
      ${key === 'unsorted' ? `<input class="quick" data-quick placeholder="Add a task and press Enter" aria-label="Add a task">` : ''}
      ${hint && !list.length ? `<div class="hint">${hint}</div>` : ''}
      <div class="cards">${list.map(t => `
        <article class="card ${dueState(t)} ${t.calendar ? 'event' : ''} ${t.status === 'done' ? 'is-done' : ''}" draggable="true" data-id="${t.id}" tabindex="0">
          <button class="check ${t.status === 'done' ? 'on' : ''}" data-toggle="${t.id}" title="${t.status === 'done' ? 'Reopen' : 'Mark done'}">✓</button>
          <div class="body"><div class="t">${esc(t.title)}</div>${cardMeta(t)}</div>
        </article>`).join('')}</div>
    </section>`;
  }).join('')}</div>`;
}

function renderList(){
  const tasks = visible().filter(t => t.status !== 'done').sort(sortByDue);
  const groups = [
    ['overdue', 'Overdue', t => dueState(t) === 'overdue'],
    ['today', 'Today', t => dueState(t) === 'today'],
    ['week', 'Next 7 days', t => t.due && dayDiff(t.due) > 0 && dayDiff(t.due) <= 7],
    ['later', 'Later', t => t.due && dayDiff(t.due) > 7],
    ['none', 'No due date', t => !t.due]
  ];
  let html = '<div class="list">';
  for (const [key, label, fn] of groups){
    const g = tasks.filter(fn);
    if (!g.length) continue;
    html += `<div class="group ${key}"><h3>${label} <span class="num">${g.length}</span></h3><div class="rows">${g.map(rowHtml).join('')}</div></div>`;
  }
  if (state.showDone){
    const done = visible().filter(t => t.status === 'done').sort((a,b) => (b.completed||'').localeCompare(a.completed||''));
    if (done.length) html += `<div class="group"><h3>Done <span class="num">${done.length}</span></h3><div class="rows">${done.map(rowHtml).join('')}</div></div>`;
  }
  if (!tasks.length && !state.showDone) html += `<p class="empty">Nothing open. Add something from the board, or capture it from your phone.</p>`;
  return html + '</div>';
}
function rowHtml(t){
  const ds = dueState(t);
  return `<div class="row ${t.status === 'done' ? 'is-done' : ''}" data-id="${t.id}" tabindex="0">
    <button class="check ${t.status === 'done' ? 'on' : ''}" data-toggle="${t.id}" title="${t.status === 'done' ? 'Reopen' : 'Mark done'}">✓</button>
    <span class="t">${esc(t.title)}${t.calendar ? ' <span style="color:var(--accent)" title="On calendar">▣</span>' : ''}</span>
    <span class="st">${LABEL[t.status] || t.status}</span>
    <span class="d num ${ds}">${esc(fmtDue(t))}</span>
  </div>`;
}

function render(){
  renderSummary();
  $('vBoard').setAttribute('aria-pressed', state.view === 'board');
  $('vList').setAttribute('aria-pressed', state.view === 'list');
  $('doneBtn').setAttribute('aria-pressed', state.showDone);
  const main = $('main');
  if (!cfg.token || !cfg.owner){
    main.innerHTML = `<div class="welcome"><h1>Welcome to Ledger</h1><p>Connect the GitHub repo that holds your tasks to get started.</p><button class="btn primary" id="connectBtn">Connect a repo</button></div>`;
    $('connectBtn').onclick = openSettings;
    return;
  }
  if (state.error && !state.loaded){
    main.innerHTML = `<div class="banner">${esc(state.error)}</div><div style="padding:0 20px"><button class="btn" id="retry">Try again</button> <button class="btn" id="fix">Check settings</button></div>`;
    $('retry').onclick = refresh; $('fix').onclick = openSettings;
    return;
  }
  if (!state.loaded){ main.innerHTML = `<p class="empty" style="padding:20px">Loading your tasks…</p>`; return; }
  const focusQuick = document.activeElement?.matches?.('[data-quick]');
  const scroll = main.scrollTop;
  main.innerHTML = state.view === 'board' ? renderBoard() : renderList();
  main.scrollTop = scroll;
  if (focusQuick) main.querySelector('[data-quick]')?.focus();
}

/* ---------- detail drawer ---------- */
function openTask(id){
  state.openId = id;
  renderDrawer();
  $('drawer').classList.add('open'); $('scrim').classList.add('open');
  document.documentElement.classList.add('drawer-open');
  $('drawer').setAttribute('aria-hidden', 'false');
}
function closeTask(){
  state.openId = null;
  $('drawer').classList.remove('open'); $('scrim').classList.remove('open');
  document.documentElement.classList.remove('drawer-open');
  $('drawer').setAttribute('aria-hidden', 'true');
}

function googleCalUrl(t){
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const d = t.due.replace(/-/g, '');
  let dates;
  if (t.time){
    const start = parseYmd(t.due); const [h, m] = t.time.split(':').map(Number); start.setHours(h, m);
    const end = new Date(start.getTime() + 3600000);
    const f = x => `${ymd(x).replace(/-/g,'')}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
    dates = `${f(start)}/${f(end)}`;
  } else {
    const n = parseYmd(t.due); n.setDate(n.getDate() + 1);
    dates = `${d}/${ymd(n).replace(/-/g, '')}`;
  }
  const details = t.subtasks.length ? t.subtasks.map(s => `${s.done ? '☑' : '☐'} ${s.text}`).join('\n') : '';
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.title)}&dates=${dates}&ctz=${encodeURIComponent(tz)}&details=${encodeURIComponent(details)}`;
}
function downloadIcs(t){
  const d = t.due.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  let when;
  if (t.time){
    const start = parseYmd(t.due); const [h, m] = t.time.split(':').map(Number); start.setHours(h, m);
    const end = new Date(start.getTime() + 3600000);
    const f = x => `${ymd(x).replace(/-/g,'')}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
    when = `DTSTART:${f(start)}\r\nDTEND:${f(end)}`;
  } else {
    const n = parseYmd(t.due); n.setDate(n.getDate() + 1);
    when = `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${ymd(n).replace(/-/g, '')}`;
  }
  const clean = s => s.replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Ledger//EN\r\nBEGIN:VEVENT\r\nUID:${t.id}@ledger\r\nDTSTAMP:${stamp}\r\n${when}\r\nSUMMARY:${clean(t.title)}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar' }));
  a.download = t.title.replace(/[^\w\s-]/g, '').trim().slice(0, 40) + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

function renderDrawer(){
  const t = state.tasks.get(state.openId);
  if (!t){ closeTask(); return; }
  $('dCheck').className = 'check' + (t.status === 'done' ? ' on' : '');
  $('dCheck').title = t.status === 'done' ? 'Reopen' : 'Mark done';
  const doneCount = t.subtasks.filter(s => s.done).length;
  $('dBody').innerHTML = `
    <textarea class="title-input" id="fTitle" rows="1" aria-label="Task name">${esc(t.title)}</textarea>
    <div class="field"><label>Status</label>
      <div class="seg" role="group" aria-label="Status">${STATUSES.map(([k, l]) => `<button data-status-set="${k}" aria-pressed="${t.status === k}">${l}</button>`).join('')}</div>
    </div>
    <div class="field"><label for="fDue">Due date</label>
      <div class="inline">
        <input type="date" class="inp num" id="fDue">
        <input type="time" class="inp num" id="fTime" aria-label="Time (optional)">
        <button class="link-btn" id="fClearTime">No time</button>
        <button class="link-btn" id="fClear">Clear date</button>
      </div>
    </div>
    <div class="field"><label>Calendar</label>
      <div>
        <div class="inline"><button class="switch" role="switch" id="fCal" aria-checked="${!!t.calendar}" aria-label="Add to calendar"></button>
        <span style="font-size:14px;color:var(--muted)">${t.calendar ? 'This is an event' : 'Just a to-do'}</span></div>
        <div id="calActions"></div>
      </div>
    </div>

    <div class="section">
      <h4>Subtasks ${t.subtasks.length ? `<span class="num">${doneCount} of ${t.subtasks.length}</span>` : ''}</h4>
      <div id="subs">${t.subtasks.map((s, i) => `
        <div class="sub ${s.done ? 'done' : ''}">
          <input type="checkbox" data-sub-check="${i}" ${s.done ? 'checked' : ''} aria-label="Done">
          <input class="txt" data-sub-text="${i}" value="${esc(s.text)}" aria-label="Subtask">
          <button class="x" data-sub-del="${i}" title="Remove subtask">×</button>
        </div>`).join('')}</div>
      <input class="add-line" id="fSubAdd" placeholder="Add a subtask and press Enter">
    </div>

    <div class="section">
      <h4>Comments ${t.comments.length ? `<span class="num">${t.comments.length}</span>` : ''}</h4>
      ${t.comments.map((c, i) => `
        <div class="comment"><div class="when"><span>${esc(fmtStamp(c.at))}</span><button class="x" data-com-del="${i}" title="Delete comment">×</button></div><p>${esc(c.text)}</p></div>`).join('')}
      <textarea class="comment-box" id="fCom" placeholder="Write a note, next step, or update"></textarea>
      <div style="text-align:right;margin-top:8px"><button class="btn primary" id="fComAdd">Add comment</button></div>
    </div>

    <div class="foot"><span>Created ${esc(fmtStamp(t.created))}</span><button class="btn danger" id="fDel">Delete task</button></div>`;

  const title = $('fTitle');
  const grow = () => { title.style.height = 'auto'; title.style.height = title.scrollHeight + 'px'; };
  grow();
  title.oninput = () => { grow(); t.title = title.value.replace(/\n/g, ' '); queueSave(t); render(); };
  title.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); title.blur(); } };

  $('dBody').querySelectorAll('[data-status-set]').forEach(b => b.onclick = () => { setStatus(t, b.dataset.statusSet); render(); renderDrawer(); });

  // Date + time: never rebuild the drawer here. Rebuilding destroys the input while
  // its iPhone picker is open, which is what made the picker flash shut.
  // Values are set as properties (not HTML attributes) so the iPhone "Reset" button
  // resets to empty instead of back to the current value.
  const fDue = $('fDue'), fTime = $('fTime');
  fDue.value = t.due || '';
  fTime.value = t.time || '';
  const syncDateUi = () => {
    fTime.disabled = !t.due;
    $('fClear').hidden = !t.due;
    $('fClearTime').hidden = !t.time;
    $('dBody').querySelectorAll('[data-status-set]').forEach(b => b.setAttribute('aria-pressed', t.status === b.dataset.statusSet));
    $('calActions').innerHTML = !t.calendar ? '' : t.due
      ? `<div class="cal-actions"><a class="btn" target="_blank" rel="noopener" href="${googleCalUrl(t)}">Add to Google Calendar</a><button class="btn" id="fIcs">Add to Apple Calendar</button></div>`
      : `<div style="font-size:13px;color:var(--muted);margin-top:6px">Set a date to add it to your calendar.</div>`;
    $('fIcs') && ($('fIcs').onclick = () => downloadIcs(t));
  };
  const setDue = v => {
    v = v || null;
    if (v === t.due) return;
    t.due = v;
    if (!v){ t.time = null; fTime.value = ''; } else promote(t);
    queueSave(t); render(); syncDateUi();
  };
  const setTime = v => {
    v = v || null;
    if (v === t.time) return;
    t.time = v;
    queueSave(t); render(); syncDateUi();
  };
  fDue.oninput = fDue.onchange = () => setDue(fDue.value);
  fTime.oninput = fTime.onchange = () => setTime(fTime.value);
  $('fClear').onclick = () => { fDue.value = ''; setDue(null); };
  $('fClearTime').onclick = () => { fTime.value = ''; setTime(null); };
  syncDateUi();
  $('fCal').onclick = () => { t.calendar = !t.calendar; if (t.calendar) promote(t); queueSave(t); render(); renderDrawer(); };

  $('dBody').querySelectorAll('[data-sub-check]').forEach(c => c.onchange = () => { t.subtasks[+c.dataset.subCheck].done = c.checked; queueSave(t); render(); renderDrawer(); });
  $('dBody').querySelectorAll('[data-sub-text]').forEach(inp => {
    inp.oninput = () => { t.subtasks[+inp.dataset.subText].text = inp.value; queueSave(t); };
    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); $('fSubAdd').focus(); } };
  });
  $('dBody').querySelectorAll('[data-sub-del]').forEach(b => b.onclick = () => { t.subtasks.splice(+b.dataset.subDel, 1); queueSave(t); render(); renderDrawer(); });
  $('fSubAdd').onkeydown = e => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return;
    e.preventDefault();
    t.subtasks.push({ text: e.target.value.trim(), done: false });
    promote(t); queueSave(t); render(); renderDrawer();
    $('fSubAdd').focus();
  };

  const addComment = () => {
    const v = $('fCom').value.trim(); if (!v) return;
    t.comments.push({ text: v, at: new Date().toISOString() });
    promote(t); queueSave(t); render(); renderDrawer();
  };
  $('fComAdd').onclick = addComment;
  $('fCom').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) addComment(); };
  $('dBody').querySelectorAll('[data-com-del]').forEach(b => b.onclick = () => { t.comments.splice(+b.dataset.comDel, 1); queueSave(t); renderDrawer(); render(); });

  $('fDel').onclick = () => { if (confirm(`Delete "${t.title}"? This can't be undone from Ledger.`)){ closeTask(); removeTask(t); } };
}

/* ---------- events ---------- */
const main = $('main');
main.addEventListener('click', e => {
  const tog = e.target.closest('[data-toggle]');
  if (tog){
    e.stopPropagation();
    const t = state.tasks.get(tog.dataset.toggle);
    setStatus(t, t.status === 'done' ? 'active' : 'done');
    if (t.status === 'done') toast(`Done: ${t.title}`);
    render(); return;
  }
  const item = e.target.closest('[data-id]');
  if (item) openTask(item.dataset.id);
});
main.addEventListener('keydown', e => {
  if (e.target.matches('[data-quick]') && e.key === 'Enter' && e.target.value.trim()){
    createTask(e.target.value); e.target.value = ''; render(); return;
  }
  if (e.key === 'Enter' && e.target.matches('[data-id]')) openTask(e.target.dataset.id);
});

// drag and drop between columns (desktop). On phones, change status from the task itself.
let dragId = null;
main.addEventListener('dragstart', e => {
  const c = e.target.closest('.card'); if (!c) return;
  dragId = c.dataset.id; c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
});
main.addEventListener('dragend', e => { e.target.closest?.('.card')?.classList.remove('dragging'); main.querySelectorAll('.col.drop').forEach(c => c.classList.remove('drop')); });
main.addEventListener('dragover', e => {
  const col = e.target.closest('.col'); if (!col || !dragId) return;
  e.preventDefault();
  main.querySelectorAll('.col.drop').forEach(c => c !== col && c.classList.remove('drop'));
  col.classList.add('drop');
});
main.addEventListener('drop', e => {
  const col = e.target.closest('.col'); if (!col || !dragId) return;
  e.preventDefault();
  const t = state.tasks.get(dragId); dragId = null;
  if (t) setStatus(t, col.dataset.status);
  render();
});

$('vBoard').onclick = () => { state.view = 'board'; LS.set('ledger.view', 'board'); render(); };
$('vList').onclick = () => { state.view = 'list'; LS.set('ledger.view', 'list'); render(); };
$('doneBtn').onclick = () => { state.showDone = !state.showDone; LS.set('ledger.showDone', state.showDone); render(); };
$('refreshBtn').onclick = () => refresh(true);
$('themeBtn').onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
  const next = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; LS.set('ledger.theme', next);
};
$('dClose').onclick = closeTask;
$('scrim').onclick = closeTask;
$('dCheck').onclick = () => {
  const t = state.tasks.get(state.openId); if (!t) return;
  setStatus(t, t.status === 'done' ? 'active' : 'done'); render(); renderDrawer();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.openId) closeTask(); });

/* Swipe the task drawer away: right, or down when scrolled to the top */
(() => {
  const d = $('drawer'), body = $('dBody');
  let x0 = null, y0 = 0, dist = 0, dir = null;
  d.addEventListener('touchstart', e => {
    if (!state.openId || e.touches.length !== 1) { x0 = null; return; }
    // Only skip a field you're actively typing in, so text selection still works there.
    const f = e.target.closest('input, textarea, select');
    if (f && f === document.activeElement) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dist = 0; dir = null;
  }, { passive: true });
  d.addEventListener('touchmove', e => {
    if (x0 === null) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    const canScroll = body.scrollHeight > body.clientHeight + 1;
    if (dir === null){
      const horizontal = Math.abs(mx) > Math.abs(my);
      // Unless the task itself can scroll that way, stop iPhone from scrolling anything behind it.
      if (horizontal || !canScroll || (my > 0 && body.scrollTop <= 0)) e.preventDefault();
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      if (horizontal) dir = mx > 0 ? 'right' : 'none';
      else dir = (my > 0 && body.scrollTop <= 0) ? 'down' : 'none';
      if (dir === 'none'){ x0 = null; return; }
      document.activeElement?.blur?.();
      d.classList.add('dragging');
    }
    e.preventDefault();
    dist = Math.max(0, dir === 'right' ? mx : my);
    d.style.transform = dir === 'right' ? `translateX(${dist}px)` : `translateY(${dist}px)`;
  }, { passive: false });
  const end = () => {
    if (x0 === null) return;
    const size = dir === 'down' ? d.offsetHeight : d.offsetWidth;
    const close = dir && dist > Math.min(90, size * 0.2);
    d.classList.remove('dragging');
    if (close && dir === 'down'){
      // Finish the slide downward, then quietly reset to the closed (off to the right) spot.
      d.style.transform = 'translateY(100%)';
      closeTask();
      setTimeout(() => { d.classList.add('dragging'); d.style.transform = ''; d.offsetWidth; d.classList.remove('dragging'); }, 260);
    } else {
      d.style.transform = '';
      if (close) closeTask();
    }
    x0 = null; dir = null;
  };
  d.addEventListener('touchend', end);
  d.addEventListener('touchcancel', end);
})();

/* ---------- settings ---------- */
function openSettings(){
  $('sOwner').value = cfg.owner; $('sRepo').value = cfg.repo; $('sBranch').value = cfg.branch; $('sToken').value = cfg.token;
  $('settings').showModal();
}
$('settingsBtn').onclick = openSettings;
$('sCancel').onclick = () => $('settings').close();
$('sSave').onclick = () => {
  cfg = {
    owner: $('sOwner').value.trim(),
    repo: $('sRepo').value.trim() || 'ledger-data',
    branch: $('sBranch').value.trim() || 'main',
    token: $('sToken').value.trim()
  };
  LS.set('ledger.cfg', cfg);
  $('settings').close();
  state.loaded = false; state.tasks = new Map();
  refresh();
};

/* ---------- load ---------- */
let loading = false;
async function refresh(manual){
  if (!cfg.token || !cfg.owner){ render(); return; }
  if (loading) return;
  loading = true;
  if (!state.loaded) render();
  try {
    await loadTasks();
    state.loaded = true; state.error = '';
    if (manual) toast('Up to date');
  } catch (e){
    state.error = `Couldn't load tasks: ${e.message}`;
    if (state.loaded) toast(state.error);
  }
  loading = false;
  render();
  if (state.openId) renderDrawer();
}
// Pick up anything captured from your phone when you come back to the tab.
document.addEventListener('visibilitychange', () => { if (!document.hidden && !state.openId && !pending.size) refresh(); });
setInterval(() => { if (!document.hidden) renderSummary(); }, 60000);

refresh();
})();
</script>
